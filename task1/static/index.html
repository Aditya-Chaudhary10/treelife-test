<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantic Translation Layer · Treelife AI</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --accent:#0f766e; --accent-2:#e0f2f1; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2; --ok-bg:#dcfce7; }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg) }
  header { background:#0b1220; color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px }
  header h1 { font-size:16px; margin:0; font-weight:600 } header nav a { color:#9fb3c8; margin-left:14px; text-decoration:none } header nav a:hover{color:#fff}
  main { display:grid; grid-template-columns: 420px 1fr; gap:20px; padding:20px 24px; max-width:1500px; margin:0 auto }
  @media (max-width:1000px){ main{grid-template-columns:1fr} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px }
  input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 14px; font:inherit; font-weight:600; cursor:pointer }
  button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line) }
  button:disabled { opacity:.5; cursor:default }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .muted { color:var(--muted) } .small { font-size:12px }
  .chip { display:inline-block; background:var(--accent-2); color:var(--accent); border-radius:999px; padding:2px 10px; font-size:12px; margin:2px 4px 2px 0; cursor:pointer; border:1px solid transparent }
  .chip:hover { border-color:var(--accent) }
  .pill { display:inline-block; border-radius:6px; padding:1px 8px; font-size:11px; font-weight:600 }
  .pill.custom { background:#fde68a; color:#78350f } .pill.builtin { background:#e5e7eb; color:#374151 }
  .pill.answer { background:var(--ok-bg); color:#166534 } .pill.empty_with_reason { background:var(--warn-bg); color:var(--warn) } .pill.unanswerable { background:var(--bad-bg); color:var(--bad) }
  table { width:100%; border-collapse:collapse; font-size:12.5px } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top } th { color:var(--muted); font-weight:600 }
  .answer { font-size:20px; font-weight:600; margin:6px 0 10px; line-height:1.35 }
  .steps li { margin-bottom:6px } .bar { height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden; width:70px; display:inline-block; vertical-align:middle } .bar i { display:block; height:100%; background:var(--accent) }
  details summary { cursor:pointer; color:var(--muted); font-size:12px } pre { background:#0b1220; color:#d1e7dd; padding:12px; border-radius:8px; overflow:auto; font-size:11.5px; max-height:380px }
  .status { font-size:12px; color:var(--muted); min-height:18px }
  .err { background:var(--bad-bg); color:var(--bad); padding:8px 10px; border-radius:8px; font-size:13px }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12px }
  .evidence { color:var(--muted); font-size:11.5px }
  .hist { border-left:3px solid var(--line); padding-left:10px; margin:8px 0; cursor:pointer } .hist:hover{ border-color:var(--accent) }
</style>
</head>
<body>
<header>
  <h1>Treelife AI · Semantic Business Data Translation Layer</h1>
  <nav><a href="/task2">Task 2: Document Workspace →</a><a href="/docs">API</a></nav>
</header>
<main>
  <section>
    <div class="card">
      <h2>1 · Connect a tool</h2>
      <label>Source</label>
      <select id="source"></select>
      <div id="sourceDesc" class="small muted" style="margin-top:6px"></div>
      <div id="cfg"></div>
      <div class="row" style="margin-top:12px">
        <button id="connectBtn">Connect &amp; discover</button>
        <label class="row small" style="margin:0"><input type="checkbox" id="remap" style="width:auto"> force re-map (ignore cache)</label>
      </div>
      <div id="connStatus" class="status" style="margin-top:8px"></div>
    </div>
    <div class="card" id="mapCard" hidden>
      <h2>2 · What the system learned about this client</h2>
      <div id="mapBody"></div>
    </div>
  </section>

  <section>
    <div class="card">
      <h2>3 · Ask in plain English</h2>
      <div class="row">
        <input id="q" placeholder="How many open deals does Garima own?" style="flex:1" disabled>
        <button id="askBtn" disabled>Ask</button>
      </div>
      <div id="examples" style="margin-top:8px"></div>
      <div id="askStatus" class="status"></div>
    </div>
    <div id="answers"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let SOURCES = [], CONN = null;
const EXAMPLES = {
  mock_crm: ["How many open deals does Garima own?", "Which deals are lost?", "Total value of open deals per owner", "How many high priority deals does Ishan have?", "Leads assigned to Ishan", "How many deals in the London region?", "Deals owned by Garmia in negotiation", "How many deals were created after June 2026?"],
  mock_jira: ["How many tickets are assigned to Ishan?", "How many completed tickets does Garima have?", "Which tickets were abandoned?", "Open high priority bugs", "Tickets per assignee"],
};
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ruleText(d, fld){ if(Array.isArray(d)) return `${fld} ∈ {${d.join(", ")}}`; if(d.all) return d.all.map(x=>ruleText(x,fld)).join(" AND "); if(d.any) return "(" + d.any.map(x=>ruleText(x,fld)).join(" OR ") + ")"; if(d.not) return "NOT " + ruleText(d.not,fld); if(d.field){ if(d.in) return `${d.field} ∈ {${d.in.join(", ")}}`; if(d.not_in) return `${d.field} ∉ {${d.not_in.join(", ")}}`; if(d.is_empty) return `${d.field} is empty`; if(d.not_empty) return `${d.field} is filled`; } return JSON.stringify(d); }

async function loadSources(){
  const r = await fetch("/api/task1/sources"); SOURCES = (await r.json()).sources;
  $("#source").innerHTML = SOURCES.map(s => `<option value="${s.id}">${esc(s.label)}</option>`).join("");
  renderCfg();
}
function renderCfg(){
  const s = SOURCES.find(x => x.id === $("#source").value);
  $("#sourceDesc").textContent = s.description || "";
  $("#cfg").innerHTML = (s.fields||[]).map(f => `<label>${esc(f.label)}</label><input data-name="${f.name}" type="${f.secret?"password":"text"}" value="${esc(f.default||"")}">`).join("");
  renderExamples();
}
function renderExamples(){
  const ex = EXAMPLES[$("#source").value] || ["How many open deals does Garima own?", "Which records are high priority?", "Records per owner"];
  $("#examples").innerHTML = ex.map(e => `<span class="chip">${esc(e)}</span>`).join("");
  document.querySelectorAll("#examples .chip").forEach(c => c.onclick = () => { $("#q").value = c.textContent; if(CONN) ask(); });
}
$("#source").onchange = renderCfg;

$("#connectBtn").onclick = async () => {
  const cfg = {}; document.querySelectorAll("#cfg input").forEach(i => cfg[i.dataset.name] = i.value);
  $("#connectBtn").disabled = true; $("#connStatus").textContent = "Fetching schema + records, profiling, building semantic map (first time takes ~10–20s)…";
  try {
    const r = await fetch("/api/task1/connect", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({source: $("#source").value, config: cfg, force_remap: $("#remap").checked})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail || r.statusText);
    CONN = j;
    const c = j.connection;
    $("#connStatus").innerHTML = `Connected <b>${esc(c.source)}</b> (${c.connector.kind}) · ` + c.collections.map(x => `${x.name}: ${x.records} records / ${x.fields} fields`).join(" · ") + (c.map_from_cache ? " · map loaded from cache" : ` · map built with ${c.discovery_usage.total_tokens||0} tokens in ${c.discovery_usage.llm_calls||0} LLM calls`);
    renderMap(j); $("#q").disabled = false; $("#askBtn").disabled = false; $("#answers").innerHTML = "";
  } catch(e){ $("#connStatus").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  $("#connectBtn").disabled = false;
};

function renderMap(j){
  const m = j.semantic_map, prof = j.profiles; let html = "";
  for (const [cname, cm] of Object.entries(m.collections)) {
    const fields = Object.fromEntries((prof[cname]?.fields||[]).map(f => [f.name, f]));
    html += `<h3 style="margin:10px 0 4px;font-size:14px">${esc(cname)} <span class="muted small">— ${esc(cm.description||"")}</span></h3>`;
    html += `<table><tr><th>concept</th><th>lives in</th><th>conf.</th></tr>`;
    for (const [concept, spec] of Object.entries(cm.concepts||{})) {
      const f = fields[spec.field]; const pill = f ? `<span class="pill ${f.is_custom?"custom":"builtin"}">${f.is_custom?"custom":"built-in"}</span>` : "";
      let vm = ""; if (spec.value_map) vm = `<div class="evidence">` + Object.entries(spec.value_map).map(([k,d]) => `<b>${esc(k)}</b> = ${esc(ruleText(d, spec.field))}`).join("<br>") + `</div>`;
      html += `<tr><td><b>${esc(concept)}</b><div class="evidence">${esc(spec.kind)}</div></td><td><code>${esc(spec.field)}</code> ${pill}<div class="evidence">${esc(spec.evidence||"")}</div>${vm}${spec.caveats?`<div class="evidence">⚠ ${esc(spec.caveats)}</div>`:""}</td><td><span class="bar"><i style="width:${Math.round((spec.confidence||0)*100)}%"></i></span> <span class="small">${Math.round((spec.confidence||0)*100)}%</span></td></tr>`;
    }
    html += `</table>`;
    const miss = Object.entries(cm.missing_concepts||{});
    if (miss.length) html += `<div class="small" style="margin-top:6px"><b>Not tracked here:</b> ` + miss.map(([k,v]) => `${esc(k)} <span class="muted">(${esc(v)})</span>`).join("; ") + `</div>`;
    if ((cm.notes||[]).length) html += `<div class="small muted" style="margin-top:4px">` + cm.notes.map(n => "• " + esc(n)).join("<br>") + `</div>`;
  }
  const people = m.people || {};
  const pk = Object.keys(people).filter(k => (people[k]||[]).some(p => p.aliases.length > 1));
  if (pk.length) {
    html += `<h3 style="margin:14px 0 4px;font-size:14px">People &amp; their spellings</h3>`;
    for (const k of pk) html += `<div class="small"><code>${esc(k)}</code><br>` + people[k].filter(p=>p.aliases.length>1).map(p => `<b>${esc(p.canonical)}</b> (${p.records}) ← ${p.aliases.map(a=>`"${esc(a)}"`).join(", ")}`).join("<br>") + `</div>`;
  }
  html += `<details style="margin-top:10px"><summary>raw semantic map JSON</summary><pre>${esc(JSON.stringify(m, null, 1))}</pre></details>`;
  $("#mapBody").innerHTML = html; $("#mapCard").hidden = false;
}

async function ask(){
  const q = $("#q").value.trim(); if(!q || !CONN) return;
  $("#askBtn").disabled = true; $("#askStatus").textContent = "Understanding intent → binding to this client's fields → executing → explaining…";
  try {
    const r = await fetch("/api/task1/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({connection_id: CONN.connection.id, question: q})});
    const j = await r.json(); if(!r.ok) throw new Error(j.detail || r.statusText);
    renderAnswer(j); $("#askStatus").textContent = "";
  } catch(e){ $("#askStatus").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  $("#askBtn").disabled = false;
}
$("#askBtn").onclick = ask; $("#q").addEventListener("keydown", e => { if(e.key === "Enter") ask(); });

function dist(d){ if(!d||!d.length) return ""; return `<table>` + d.map(([k,v]) => `<tr><td>${esc(k)}</td><td><b>${v}</b></td></tr>`).join("") + `</table>`; }
function renderAnswer(j){
  const label = {answer:"answered from data", empty_with_reason:"nothing matched — here's why", unanswerable:"can't be answered from this data"}[j.answer_type];
  let html = `<div class="card"><div class="row"><span class="pill ${j.answer_type}">${label}</span><span class="small muted">confidence ${Math.round((j.confidence||0)*100)}% · ${j.usage.total_tokens} tokens · ${j.usage.llm_calls} LLM calls · ${j.elapsed_s}s</span></div>`;
  html += `<div class="small muted" style="margin-top:8px">Q: ${esc(j.question)}</div><div class="answer">${esc(j.answer)}</div>`;
  if (j.result && j.result.groups) html += `<table><tr><th>group</th><th>value</th></tr>` + j.result.groups.map(([k,v]) => `<tr><td>${esc(k)}</td><td><b>${v}</b></td></tr>`).join("") + `</table>`;
  html += `<h2 style="margin-top:14px">How I got this</h2><ol class="steps">` + (j.steps||[]).map(s => `<li>${esc(s)}</li>`).join("") + `</ol>`;
  if (j.problems && j.problems.length) html += `<div class="err">` + j.problems.map(esc).join("<br>") + `</div>`;
  if (j.zero_diagnosis) html += `<div style="background:var(--warn-bg);padding:10px;border-radius:8px;margin-top:8px"><b>Why zero:</b> ${esc(j.zero_diagnosis.message)}${dist(j.zero_diagnosis.distribution)}</div>`;
  for (const c of (j.context||[])) html += `<details style="margin-top:8px"><summary>${esc(c.title)}</summary>${dist(c.distribution)}</details>`;
  const rows = j.result?.matched_preview || [];
  if (rows.length) {
    const cols = Object.keys(rows[0]).filter(k => !/^(id|update_time|pipeline|currency|probability|won_time|lost_time)$/.test(k)).slice(0, 8);
    html += `<details style="margin-top:8px"><summary>matched records (showing ${rows.length} of ${j.result.count})</summary><div style="overflow:auto"><table><tr>` + cols.map(c => `<th>${esc(c)}</th>`).join("") + `</tr>` + rows.map(r => `<tr>` + cols.map(c => `<td>${esc(Array.isArray(r[c]) ? r[c].join(", ") : r[c])}</td>`).join("") + `</tr>`).join("") + `</table></div></details>`;
  }
  html += `<details style="margin-top:8px"><summary>plan &amp; intent (JSON)</summary><pre>${esc(JSON.stringify({intent: j.intent, plan: j.plan, usage: j.usage}, null, 1))}</pre></details></div>`;
  $("#answers").insertAdjacentHTML("afterbegin", html);
}
loadSources();
</script>
</body>
</html>
